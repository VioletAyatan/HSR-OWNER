[workspace]
resolver = "3"
members = ["resource-data", "typesniff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }

[profile.release]
opt-level = 3
debug = 1
